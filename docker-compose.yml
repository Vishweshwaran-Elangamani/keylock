services:
  mysql:
    image: mysql:8.0
    container_name: eepz-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eepzdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d  
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --protocol=TCP -h mysql -uroot -p$root"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - eepz-network

  auth-api:
    build: ./Relevantz.EEPZ.AuthApi
    container_name: eepz-auth-api
    restart: always
    ports:
      - "5101:5101"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=eepzdb;User=root;Password=root;
      - ASPNETCORE_URLS=http://+:5101
      - Jwt__Issuer=EEPZ
      - Jwt__Audience=EEPZUsers
      - Jwt__SecretKey=f05505b63f8d9e2e5535089d6b13193d
      - Jwt__AccessTokenExpirationMinutes=60
      - Jwt__RefreshTokenExpirationDays=7
      - SmtpSettings__Host=smtp.gmail.com
      - SmtpSettings__Port=587
      - SmtpSettings__EnableSsl=true
      - SmtpSettings__Username=emailserviceeepz@gmail.com
      - SmtpSettings__Password=bvnw qmio msiq cgat
      - SmtpSettings__FromEmail=noreply@eepz.com
      - SmtpSettings__FromName=EEPZ System
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/Logs
    networks:
      - eepz-network

