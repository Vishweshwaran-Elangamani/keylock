services:
  # ── MYSQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: eepz-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eepzdb
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --silent --protocol=TCP -h mysql -uroot -proot"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - eepz-network



  # ── KEYCLOAK ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: eepz-keycloak
    restart: always
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://eepz-mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_COOKIE_SAMESITE: LAX
      KC_HTTP_COOKIE_SECURE: "false"
      KEYCLOAK_FRONTEND_URL: "http://localhost:9090"
      KC_FEATURES: preview
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    
    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "9090:9090"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - eepz-network
  # ── MONGODB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: eepz-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eepz-network

  # ── AUTH API (UNCHANGED) ──────────────────────────────────────────────────
  auth-api:
    build: ./Relevantz.EEPZ.AuthApi
    container_name: eepz-auth-api
    restart: always
    ports:
      - "5101:5101"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=eepzdb;User=root;Password=root;
      - ASPNETCORE_URLS=http://+:5101
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017
      - MongoDbSettings__DatabaseName=EEPZFileStorage
      - MongoDbSettings__ProfileImagesCollectionName=ProfileImages
      - Keycloak__BaseUrl=http://keycloak:9090
      - Keycloak__Realm=eepz-realm
      - Keycloak__ClientId=eepz-client
      - Keycloak__AdminUser=admin
      - Keycloak__AdminPassword=admin
      - Keycloak__ValidIssuers=http://host.docker.internal:9090/realms/eepz-realm,http://localhost:9090/realms/eepz-realm,https://unprotractive-elmo-estipulate.ngrok-free.dev/realms/eepz-realm
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      - ./logs:/app/Logs
    networks:
      - eepz-network

  # ── ANALYSIS API (PYTHON – UNCHANGED) ──────────────────────────────────────
  analysis-api:
    build: ./Relevantz.EEPZ.AnalysisApi
    container_name: eepz-analysis-api
    restart: always
    ports:
      - "5111:5111"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/Logs
    networks:
      - eepz-network

