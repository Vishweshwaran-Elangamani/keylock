version: "3.9"

networks:
  eepz_eepz-network:
    external: true

services:
  rewards-api:
    build: .
    container_name: eepz-rewards-api
    restart: always
    ports:
      - "5114:5114"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}

      # Use DSNs from .env (NOT hardcoded)
      CONNECTIONSTRINGS__DEFAULTCONNECTION: ${CONNECTIONSTRINGS__DEFAULTCONNECTION}
      CONNECTIONSTRINGS__EEPZDB: ${CONNECTIONSTRINGS__EEPZDB}

      # Mongo, JWT, SMTP, AdminSeed from .env
      MONGODB__CONNECTIONSTRING: ${MONGODB__CONNECTIONSTRING}
      MONGODB__DATABASENAME: ${MONGODB__DATABASENAME}

      JWT__ISSUER: ${JWT__ISSUER}
      JWT__AUDIENCE: ${JWT__AUDIENCE}
      JWT__SECRETKEY: ${JWT__SECRETKEY}
      JWT__ACCESSTOKENEXPIRATIONMINUTES: ${JWT__ACCESSTOKENEXPIRATIONMINUTES}
      JWT__REFRESHTOKENEXPIRATIONDAYS: ${JWT__REFRESHTOKENEXPIRATIONDAYS}

      SMTPSETTINGS__HOST: ${SMTPSETTINGS__HOST}
      SMTPSETTINGS__PORT: ${SMTPSETTINGS__PORT}
      SMTPSETTINGS__ENABLESSL: ${SMTPSETTINGS__ENABLESSL}
      SMTPSETTINGS__USERNAME: ${SMTPSETTINGS__USERNAME}
      SMTPSETTINGS__PASSWORD: ${SMTPSETTINGS__PASSWORD}
      SMTPSETTINGS__FROMEMAIL: ${SMTPSETTINGS__FROMEMAIL}
      SMTPSETTINGS__FROMNAME: ${SMTPSETTINGS__FROMNAME}

      ADMINSEEDDATA__EMAIL: ${ADMINSEEDDATA__EMAIL}
      ADMINSEEDDATA__PASSWORD: ${ADMINSEEDDATA__PASSWORD}
      ADMINSEEDDATA__FIRSTNAME: ${ADMINSEEDDATA__FIRSTNAME}
      ADMINSEEDDATA__LASTNAME: ${ADMINSEEDDATA__LASTNAME}
      ADMINSEEDDATA__EMPLOYEECOMPANYID: ${ADMINSEEDDATA__EMPLOYEECOMPANYID}
      ADMINSEEDDATA__MOBILENUMBER: ${ADMINSEEDDATA__MOBILENUMBER}

    volumes:
      - ./logs:/app/Logs
      - ./dataprotection:/home/app/.aspnet/DataProtection-Keys

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5114/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - eepz_eepz-network
